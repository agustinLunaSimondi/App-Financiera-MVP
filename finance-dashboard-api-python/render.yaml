services:
  - type: web
    name: finance-dashboard-api
    runtime: python
    rootDir: finance-dashboard-api-python
    buildCommand: pip install -r requirements.txt
    startCommand: (alembic upgrade head || echo "Database already up to date or migration failed") && gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Clave Fernet para cifrar tokens OAuth de terceros (MP) en DB.
      # Generar con: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: ENCRYPTION_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: POSTHOG_API_KEY
        sync: false
      - key: POSTHOG_HOST
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_REDIRECT_URI
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      # Proxy de Gemini en Vercel (US). Render tiene la IP de egress geo-bloqueada
      # por Gemini, así que las llamadas se enrutan vía el proxy serverless.
      - key: GEMINI_PROXY_URL
        sync: false
      - key: GEMINI_PROXY_SECRET
        sync: false
